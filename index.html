<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TES09</title>

  <!-- Leaflet Core -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; background: #e5e5e5; }
    .leaflet-popup-content-wrapper { padding: 14px; border-radius: 8px; font-family: sans-serif; }
    .leaflet-popup-content h4 { margin: 0 0 6px 0; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 4px; color: #111; }
    .leaflet-popup-content p { margin: 4px 0; font-size: 14px; color: #444; }
  </style>
</head>

<body oncontextmenu="return false;">
  <div id="map"></div>

  <script>
    var map = L.map("map", { contextmenu: false }).setView([0, 0], 2);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    var filterControl = L.control.layers(null, null, { collapsed: true }).addTo(map);
    var groups = {};
    var markersClusterGroup = L.markerClusterGroup({ maxClusterRadius: 50, showCoverageOnHover: false });
    map.addLayer(markersClusterGroup);

    var markerColors = {
      "film location": "red",
      "music location": "blue",
      "literature location": "gold",
      "Default": "green"
    };

    function getCustomIcon(colorName) {
      return L.icon({
        iconUrl: './' + colorName + '.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
      });
    }

    fetch("./atad-pam.geojson")
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: function(feature, latlng) {
            var catValue = feature.properties.category || "Default";
            var clr = markerColors[catValue] || markerColors["Default"];
            var marker = L.marker(latlng, { icon: getCustomIcon(clr) });

            if (!groups[catValue]) {
              groups[catValue] = L.layerGroup();
              filterControl.addOverlay(groups[catValue], catValue);
            }

            groups[catValue].addLayer(marker);
            markersClusterGroup.addLayer(marker);
            return marker;
          },
          onEachFeature: function(feature, layer) {
            var description = "";
            ["name", "description", "category", "genre", "misc"].forEach(function(key) {
              if (feature.properties[key]) {
                if (key === "name") {
                  description += "<h4>" + feature.properties[key] + "</h4>";
                } else {
                  description += "<p><strong>" + key + ":</strong> " + feature.properties[key] + "</p>";
                }
              }
            });
            layer.bindPopup(description || "Location details");
          }
        });

        var allBounds = markersClusterGroup.getBounds();
        if (allBounds.isValid()) {
          map.fitBounds(allBounds, { padding: [40, 40] });
        }
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
