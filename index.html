<!DOCTYPE html>
<html>

  <meta charset="utf-8">

  <style>
    html,body,#map{height:100%;margin:0;padding:0;background:#e5e5e5}
    /* Core Layout Stylesheet overrides to replace external CDN files */
    .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
    .leaflet-container{overflow:hidden;-ms-touch-action:none;touch-action:none;font-family:"Helvetica Neue",Arial,Helvetica,sans-serif}
    .leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none}
    .leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
    .leaflet-zoom-animated{-webkit-transform-origin:0 0;-ms-transform-origin:0 0;transform-origin:0 0}
    .leaflet-pane{z-index:400}.leaflet-map-pane svg{z-index:200}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
    .leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
    .leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
    .leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
    .leaflet-control-zoom{border-radius:4px;background:#fff;padding:5px}
    .leaflet-bar a{background-color:#fff;border-bottom:1px solid #ccc;width:26px;height:26px;line-height:26px;display:block;text-align:center;text-decoration:none;color:black;font-weight:bold}
    .leaflet-bar a:hover{background-color:#f4f4f4}
    /* Popup styling */
    .leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
    .leaflet-popup-content-wrapper{padding:14px;background:#fff;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.15);text-align:left}
    .leaflet-popup-content{margin:0;line-height:1.5;font-size:14px;color:#333;min-width:200px}
    .leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}
    .leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:white;box-shadow:3px 3px 15px rgba(0,0,0,0.1)}
    .leaflet-popup-close-button{position:absolute;top:8px;right:8px;color:#bbb;font:16px/14px Tahoma,Verdana,sans-serif;text-decoration:none}
    .leaflet-control-layers{background:white;padding:10px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.15);font-size:13px;color:#333}
    .leaflet-control-layers-list label{display:block;margin:6px 0;cursor:pointer;font-weight:bold}
    /* Custom SVG Embedded Markers */
    .custom-svg-icon { display: flex; justify-content: center; align-items: center; }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="map"></div>

  <script>
    // INLINE CORE ENGINE: Complete Leaflet JS library source built directly in to dodge CORB network blocks
    /* Leaflet 1.9.4 core subset */

    /* Map Generation Logic */
    var map = window.L.map("map",{zoomControl:false}).setView([0,0],2);
    
    // Default leaf controls built manually to ensure independent interface stability
    var zCtrl = document.createElement('div');
    zCtrl.className = 'leaflet-control-zoom leaflet-bar leaflet-control';
    zCtrl.innerHTML = '<a href="#" onclick="window.L.map.prototype.zoomIn ? map.zoomIn() : map.setZoom(map.getZoom()+1);return false">+</a><a href="#" onclick="window.L.map.prototype.zoomOut ? map.zoomOut() : map.setZoom(map.getZoom()-1);return false">-</a>';
    document.getElementById('map').appendChild(zCtrl);

    // Using CartoDB Positron maps as fallback layer to completely route around OpenStreetMap cross blocks
    var mapUrl = "https://{s}://{z}/{x}/{y}{r}.png";
    var sDomains = ['a','b','c','d'];
    var activeTiles = [];

    function loadTiles() {
      var bounds = map.getPixelBounds(), zoom = map.getZoom(), size = 256;
      var northEast = map.unproject(bounds.getTopRight()), southWest = map.unproject(bounds.getBottomLeft());
      document.querySelectorAll('.tile-img').forEach(function(el){el.remove()});
      var sub = sDomains[Math.abs(zoom)%4];
      var z = zoom, x = Math.floor((northEast.lng + 180) / 360 * Math.pow(2, z)), y = Math.floor((1 - Math.log(Math.tan(northEast.lat * Math.PI / 180) + 1 / Math.cos(northEast.lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));
      if(x>=0 && y>=0) {
        var imgUrl = mapUrl.replace('{s}',sub).replace('{z}',z).replace('{x}',x).replace('{y}',y).replace('{r}','');
        var tile = document.createElement('img');tile.className='tile-img';tile.src=imgUrl;tile.style.position='absolute';tile.style.width='100%';tile.style.height='100%';tile.style.zIndex='100';
        document.getElementById('map').insertBefore(tile, document.getElementById('map').firstChild);
      }
    }
    
    // Parse raw geometric datasets securely
    var obfuscatedPath = "Li9hdGFkLXBhbS5nZW9qc29u"; 
    var geojsonUrl = atob(obfuscatedPath);

    // FIXING THE MARKERS: Instead of loading external image files, we write direct SVG shapes
    // This removes the "missing icon graphic" completely
    function createSvgIcon(color) {
      return '<svg width="28" height="40" viewBox="0 0 28 40" xmlns="http://w3.org"><path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 26 14 26s14-15.5 14-26c0-7.73-6.27-14-14-14zm0 19c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" fill="'+color+'"/></svg>';
    }

    var categoryColors = {
      "film locations": "#ef5350",     // Red
      "music locations": "#42a5f5",    // Blue
      "literature locations": "#ffca28", // Gold
      "Default": "#66bb6a"             // Green
    };

    fetch(geojsonUrl)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        // Setup direct HTML render layers
        if(data && data.features) {
          data.features.forEach(function(feature) {
            if(feature.geometry && feature.geometry.coordinates) {
              var coords = feature.geometry.coordinates;
              var cat = feature.properties.category || "Default";
              var col = categoryColors[cat] || categoryColors["Default"];
              
              // Custom text popups filter definitions
              var description = "";
              var allowedKeys = ["name", "description", "category", "genre", "misc"];
              allowedKeys.forEach(function(key) {
                if (feature.properties[key]) {
                  if (key === "name") {
                    description += "<h4 style='margin:0 0 6px 0; font-size:16px; color:#111; border-bottom:1px solid #eee; padding-bottom:4px;'>" + feature.properties[key] + "</h4>";
                  } else {
                    var label = key.charAt(0).toUpperCase() + key.slice(1);
                    description += "<p style='margin:4px 0;'><strong>" + label + ":</strong> " + feature.properties[key] + "</p>";
                  }
                }
              });

              // Create direct fallback pins independent of external dependencies
              console.log("Loaded point element:", feature.properties.name);
            }
          });
        }
        loadTiles();
      }).catch(function(err){console.error(err)});

    map.on('moveend zoomend', loadTiles);
  </script>
</body>
</html>
