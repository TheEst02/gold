<style>
  html, body, #map { height: 100%; margin: 0; padding: 0; background: #e5e5e5; }
  .leaflet-popup-content-wrapper { padding: 14px; border-radius: 8px; font-family: sans-serif; }
  .leaflet-popup-content h4 { margin: 0 0 6px 0; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 4px; color: #111; }
  .leaflet-popup-content p { margin: 4px 0; font-size: 14px; color: #444; }

.marker-label {
  font-size: 11px;
  color: #222;
  background: transparent;
  border: none;
  box-shadow: none;
  padding: 0;
  margin-left: 4px;
  white-space: nowrap;
  text-shadow: 0 1px 2px rgba(255,255,255,0.8), 
               0 -1px 2px rgba(255,255,255,0.4);
}

.base-toggle-control {
  background: white;
  padding: 6px;
  border-radius: 6px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  font-family: sans-serif;
  margin-bottom: 8px;
}

.toggle-btn {
  border: none;
  background: #ddd;
  padding: 4px 10px;
  margin: 0 2px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}

.toggle-btn.active {
  background: #4CAF50;
  color: white;
}
</style>

</head>

<body oncontextmenu="return false;">
<div id="map"></div>

<script>
var map = L.map("map", { contextmenu: false }).setView([0, 0], 2);

// URL Parameter Reader
function getParam(name) {
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

var targetId  = getParam("id");
var viewMode  = getParam("view");
var zoomLevel = parseInt(getParam("zoom")) || 17;

// --- Base layers ---
var streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
}).addTo(map);

var satelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
  maxZoom: 20,
  subdomains:['mt0','mt1','mt2','mt3']
});

// --- Base Layer Toggle Control ---
var BaseToggle = L.Control.extend({
  options: { position: 'topright' },
  onAdd: function(map) {
    var div = L.DomUtil.create('div', 'base-toggle-control');
    div.innerHTML = `
      <button id="btn-map" class="toggle-btn active">Map</button>
      <button id="btn-sat" class="toggle-btn">Satellite</button>
    `;
    return div;
  }
});
map.addControl(new BaseToggle());

// --- Label Contrast Function ---
function setLabelContrast(mode) {
  var labels = document.querySelectorAll('.marker-label');
  labels.forEach(l => {
    if (mode === "sat") {
      l.style.color = "#fff";
      l.style.textShadow = "0 1px 3px rgba(0,0,0,0.8)";
    } else {
      l.style.color = "#222";
      l.style.textShadow = "0 1px 2px rgba(255,255,255,0.8)";
    }
  });
}

// --- Satellite startup (correct placement) ---
if (viewMode === "sat") {
  map.removeLayer(streetLayer);
  map.addLayer(satelliteLayer);
  setLabelContrast("sat");

  document.getElementById("btn-sat").classList.add("active");
  document.getElementById("btn-map").classList.remove("active");
}
