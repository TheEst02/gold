<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TES04</title>
  
  <!-- Load full Leaflet Core Styles & Engines -->
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>

  <!-- Performance Clustering Engines to scale up smoothly to 3,000+ points -->
  <link rel="stylesheet" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; background: #e5e5e5; }
    .leaflet-popup-content-wrapper { padding: 14px; border-radius: 8px; font-family: sans-serif; }
    .leaflet-popup-content h4 { margin: 0 0 6px 0; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 4px; color: #111; }
    .leaflet-popup-content p { margin: 4px 0; font-size: 14px; color: #444; }
  </style>
</head>
<body oncontextmenu="return false;"> <!-- ANTI-THEFT: Disables right click -->

  <div id="map"></div>

  <script>
    // Initialize map canvas engine globally
    var map = L.map("map", { contextmenu: false }).setView([0, 0], 2);

    // Repaired secure, neutral base layer graphics from CartoDB
    L.tileLayer("https://{s}://{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      attribution: "&copy; <a href='https://openstreetmap.org'>OpenStreetMap</a> contributors &copy; <a href='https://carto.com'>CARTO</a>"
    }).addTo(map);

    // Dynamic filtering switcher control layout configured to fold cleanly automatically
    var filterControl = L.control.layers(null, null, { collapsed: true }).addTo(map);
    var groups = {};

    // Performance group array clustering handles large point datasets safely
    var markersClusterGroup = L.markerClusterGroup({ maxClusterRadius: 50, showCoverageOnHover: false });
    map.addLayer(markersClusterGroup);

    // Mapping text descriptors directly into bright marker paths
    var markerColors = {
      "film locations": "red",
      "music locations": "blue",
      "literature locations": "gold",
      "Default": "green"
    };

    // Repaired custom icon builder with standard coordinate dimensions
    function getCustomIcon(colorName) {
      return L.icon({
        iconUrl: './' + colorName + '.png',
        shadowUrl: 'https://unpkg.com',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      });
    }

    // Fetch the spatial dataset locally right out of your repository folder
    fetch("./atad-pam.geojson")
      .then(function(res) { return res.json(); })
      .then(function(data) {
        L.geoJSON(data, {
          pointToLayer: function(feature, latlng) {
            var catValue = feature.properties.category || "Default";
            var clr = markerColors[catValue] || markerColors["Default"];
            var marker = L.marker(latlng, { icon: getCustomIcon(clr) });
            
            if (!groups[catValue]) {
              groups[catValue] = L.layerGroup();
              var displayTitle = catValue.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
              filterControl.addOverlay(groups[catValue], displayTitle);
            }
            
            groups[catValue].addLayer(marker);
            markersClusterGroup.addLayer(marker);
            return marker;
          },
          onEachFeature: function(feature, layer) {
            if (feature.properties) {
              var description = "";
              var whitelist = ["name", "description", "category", "genre", "misc"];
              
              whitelist.forEach(function(key) {
                if (feature.properties[key]) {
                  if (key === "name") {
                    description += "<h4>" + feature.properties[key] + "</h4>";
                  } else {
                    var label = key.charAt(0).toUpperCase() + key.slice(1);
                    description += "<p><strong>" + label + ":</strong> " + feature.properties[key] + "</p>";
                  }
                }
              });
              layer.bindPopup(description || "Location details");
            }
          }
        });

        var allBounds = markersClusterGroup.getBounds();
        if (allBounds.isValid()) { map.fitBounds(allBounds, { padding: [40, 40] }); }
      })
      .catch(function(err) { console.error(err); });
  </script>
       
</body>
</html>
