<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BEM_07</title>
  
  <!-- 
    NO EXTERNAL STYLESHEETS: All core Leaflet & Marker layout positions 
    are written inline below to completely bypass the unpkg URL block.
  -->
  <style>
    html,body,#map{height:100%;margin:0;padding:0;background:#e5e5e5}
    .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
    .leaflet-container{overflow:hidden;-ms-touch-action:none;touch-action:none;font-family:"Helvetica Neue",Arial,Helvetica,sans-serif}
    .leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none}
    .leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
    .leaflet-zoom-animated{-webkit-transform-origin:0 0;-ms-transform-origin:0 0;transform-origin:0 0}
    .leaflet-pane{z-index:400}.leaflet-map-pane svg{z-index:200}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
    .leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
    .leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
    .leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
    
    /* Control Box Interface Panels */
    .leaflet-control-zoom{border-radius:4px;background:#fff;padding:5px}
    .leaflet-bar a{background-color:#fff;border-bottom:1px solid #ccc;width:26px;height:26px;line-height:26px;display:block;text-align:center;text-decoration:none;color:black;font-weight:bold}
    .leaflet-bar a:hover{background-color:#f4f4f4}
    .leaflet-control-layers{background:white;padding:10px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.15);font-size:13px;color:#333}
    .leaflet-control-layers-list label{display:block;margin:6px 0;cursor:pointer;font-weight:bold}
    
    /* Elegant Clean Popups */
    .leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
    .leaflet-popup-content-wrapper{padding:14px;background:#fff;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.15);text-align:left}
    .leaflet-popup-content{margin:0;line-height:1.5;font-size:14px;color:#333;min-width:200px}
    .leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}
    .leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:white;box-shadow:3px 3px 15px rgba(0,0,0,0.1)}
    .leaflet-popup-close-button{position:absolute;top:8px;right:8px;color:#bbb;font:16px/14px Tahoma,Verdana,sans-serif;text-decoration:none}
  </style>

  <!-- Load the JavaScript Core Engine safely via strict script source -->
  <script src="https://unpkg.com"></script>
</head>
<body oncontextmenu="return false;">

  <div id="map"></div>

  <script>
    // SECURITY: Simple string validation bypasses Blogger parser blocks
    var host = window.location.hostname;
    if (host.indexOf("github.io") === -1 && host.indexOf("blogspot") === -1 && host.indexOf("theestablishingshot") === -1) {
      document.body.innerHTML = "";
      throw new Error("Safety stop.");
    }

    // Initialize Map Instance Canvas
    var map = L.map("map", { zoomControl: false, contextmenu: false }).setView([20, 0], 2);

    // Standard high-performance map tile delivery
    L.tileLayer("https://{s}://{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      attribution: "&copy; CartoDB"
    }).addTo(map);

    // Map control utility zoom buttons
    var zoomControl = document.createElement('div');
    zoomControl.className = 'leaflet-control-zoom leaflet-bar leaflet-control';
    zoomControl.innerHTML = '<a href="#" onclick="map.zoomIn();return false">+</a><a href="#" onclick="map.zoomOut();return false">-</a>';
    document.getElementById('map').appendChild(zoomControl);

    // Dynamic layer key selector control setup
    var layersControl = L.control.layers(null, null, { collapsed: true }).addTo(map);
    var categoryLayers = {};

    // INLINE VECTOR PINS: Generates crisp, colorful pin markers using native browser SVGs
    function getSvgMarker(pinColor) {
      return L.divIcon({
        className: 'custom-pin',
        html: '<svg width="24" height="36" viewBox="0 0 24 36"><path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 24 12 24s12-15 12-24c0-6.63-5.37-12-12-12zm0 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" fill="' + pinColor + '"/></svg>',
        iconSize: [24, 36],
        iconAnchor: [12, 36],
        popupAnchor: [0, -32]
      });
    }

    // Set marker hex color configurations directly matching your columns
    var markerColors = {
      "film locations": "#ef5350",       // Red
      "music locations": "#42a5f5",      // Blue
      "literature locations": "#ffca28",   // Gold
      "Default": "#66bb6a"               // Green
    };

    // Load and build data coordinates natively
    fetch("./atad-pam.geojson")
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data.features) {
          var boundsArray = [];

          data.features.forEach(function(feature) {
            if (feature.geometry && feature.geometry.coordinates) {
              var lng = feature.geometry.coordinates[0];
              var lat = feature.geometry.coordinates[1];
              var cat = feature.properties.category || "Default";
              var color = markerColors[cat] || markerColors["Default"];
              
              // Filter and clean popup layout strings natively
              var popupHtml = "";
              var fields = ["name", "description", "category", "genre", "misc"];
              
              for (var i = 0; i < fields.length; i++) {
                var field = fields[i];
                if (feature.properties[field]) {
                  if (field === "name") {
                    popupHtml += "<h4 style='margin:0 0 6px 0; font-size:16px; color:#111; border-bottom:1px solid #eee; padding-bottom:4px;'>" + feature.properties[field] + "</h4>";
                  } else {
                    var label = field.charAt(0).toUpperCase() + field.slice(1);
                    popupHtml += "<p style='margin:4px 0;'><strong>" + label + ":</strong> " + feature.properties[field] + "</p>";
                  }
                }
              }

              // Create map point
              var marker = L.marker([lat, lng], { icon: getSvgMarker(color) }).bindPopup(popupHtml || "Location details");
              boundsArray.push([lat, lng]);

              // Manage interactive toggle groups
              if (!categoryLayers[cat]) {
                categoryLayers[cat] = L.layerGroup().addTo(map);
                var formattedTitle = cat.toUpperCase();
                layersControl.addOverlay(categoryLayers[cat], formattedTitle);
              }
              categoryLayers[cat].addLayer(marker);
            }
          });

          // Focus viewport map position smoothly over data bounds
          if (boundsArray.length > 0) {
            map.fitBounds(L.latLngBounds(boundsArray), { padding: [30, 30] });
          }
        }
      })
      .catch(function(err) { console.error("Data load failed:", err); });
  </script>
</body>
</html>
