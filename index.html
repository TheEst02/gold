<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BEMap_fin_02</title>
  
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; background: #e5e5e5; }
    
    /* Core structural layout overrides for Leaflet */
    .leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas, .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer { position: absolute; left: 0; top: 0; }
    .leaflet-container { overflow: hidden; -ms-touch-action: none; touch-action: none; font-family: "Helvetica Neue", Arial, Helvetica, sans-serif; }
    .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow { -webkit-user-select: none; -moz-user-select: none; user-select: none; -webkit-user-drag: none; }
    .leaflet-tile { filter: inherit; visibility: hidden; }
    .leaflet-tile-loaded { visibility: inherit; }
    .leaflet-zoom-animated { -webkit-transform-origin: 0 0; -ms-transform-origin: 0 0; transform-origin: 0 0; }
    .leaflet-pane { z-index: 400; }
    .leaflet-map-pane svg { z-index: 200; }
    .leaflet-tile-pane    { z-index: 200; }
    .leaflet-overlay-pane { z-index: 400; }
    .leaflet-shadow-pane  { z-index: 500; }
    .leaflet-marker-pane  { z-index: 600; }
    .leaflet-tooltip-pane { z-index: 650; }
    .leaflet-popup-pane   { z-index: 700; }
    .leaflet-control { position: relative; z-index: 800; pointer-events: auto; float: left; clear: both; }
    .leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
    .leaflet-top { top: 0; } .leaflet-right { right: 0; } .leaflet-bottom { bottom: 0; } .leaflet-left { left: 0; }
    
    /* Clean, modern popup bubble styling */
    .leaflet-popup { position: absolute; text-align: center; margin-bottom: 20px; }
    .leaflet-popup-content-wrapper { padding: 14px; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); text-align: left; }
    .leaflet-popup-content { margin: 0; line-height: 1.5; font-size: 14px; color: #333; min-width: 200px; }
    .leaflet-popup-tip-container { width: 40px; height: 20px; position: absolute; left: 50%; margin-left: -20px; overflow: hidden; pointer-events: none; }
    .leaflet-popup-tip { width: 17px; height: 17px; padding: 1px; margin: -10px auto 0; transform: rotate(45deg); background: white; box-shadow: 3px 3px 15px rgba(0,0,0,0.1); }
    .leaflet-popup-close-button { position: absolute; top: 8px; right: 8px; color: #bbb; font: 16px/14px Tahoma, Verdana, sans-serif; text-decoration: none; }

    /* Custom Category Key Menu Styling */
    .leaflet-control-layers { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.15); font-size: 13px; font-weight: bold; color: #333; }
    .leaflet-control-layers-list label { display: block; margin: 6px 0; cursor: pointer; }
  </style>

  <script src="https://unpkg.com"></script>
</head>
<body oncontextmenu="return false;"> <!-- ANTI-THEFT: Disables right-click menu to stop data inspecting -->

  <div id="map"></div>

  <script>
    // ANTI-THEFT: Domain Lockout System
    // Crashes map script execution if framed anywhere outside your custom blog setup
var allowedHost = "://blogspot.com";
    if (window.self !== window.top) {
      try {
        if (!parent.location.hostname.includes(allowedHost)) {
          document.body.innerHTML = "";
          throw new Error("Unauthorized domain deployment.");
        }
      } catch (e) {
        document.body.innerHTML = "";
      }
    }

    var map = L.map("map", { contextmenu: false }).setView([0, 0], 2);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, 
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    // ANTI-THEFT: Obfuscated Base64 file string path locator for "./atad-pam.geojson"
    var obfuscatedPath = "Li9hdGFkLXBhbS5nZW9qc29u"; 
    var geojsonUrl = atob(obfuscatedPath);

    // CUSTOM MARKERS: Maps your exact categories to unique visual markers
    var categoryIcons = {
      "film locations": L.icon({
        iconUrl: 'https://githubusercontent.com',
        shadowUrl: 'https://unpkg.com',
        iconSize:, iconAnchor:, popupAnchor: [1, -34], shadowSize: [41, 41]
      }),
      "music locations": L.icon({
        iconUrl: 'https://githubusercontent.com',
        shadowUrl: 'https://unpkg.com',
        iconSize:, iconAnchor:, popupAnchor: [1, -34], shadowSize: [41, 41]
      }),
      "literature locations": L.icon({
        iconUrl: 'https://githubusercontent.com',
        shadowUrl: 'https://unpkg.com',
        iconSize:, iconAnchor:, popupAnchor: [1, -34], shadowSize: [41, 41]
      }),
      "Default": L.icon({
        iconUrl: 'https://githubusercontent.com',
        shadowUrl: 'https://unpkg.com',
        iconSize:, iconAnchor:, popupAnchor: [1, -34], shadowSize: [41, 41]
      })
    };

    var groups = {};
    // Creates the interactive toggle switcher overlay control panel
    var filterControl = L.control.layers(null, null, { collapsed: false }).addTo(map);

    fetch(geojsonUrl)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        
        L.geoJSON(data, {
          pointToLayer: function(feature, latlng) {
            // Target specific property "category" to split group layers
            var catValue = feature.properties.category || "Default";
            var selectedIcon = categoryIcons[catValue] || categoryIcons["Default"];
            
            var marker = L.marker(latlng, { icon: selectedIcon });
            
            // Build groups dynamically based on file inputs and format key label nicely
            if (!groups[catValue]) {
              groups[catValue] = L.layerGroup().addTo(map);
              
              // Capitalise group names for the key interface panel layout
              var displayTitle = catValue.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
              filterControl.addOverlay(groups[catValue], displayTitle);
            }
            groups[catValue].addLayer(marker);
            return marker;
          },
          onEachFeature: function(feature, layer) {
            if (feature.properties) {
              var description = "";
              
              // POPUP CLEANUP: Explicit layout whitelist filter configuration
              var allowedKeys = ["name", "description", "category", "genre", "misc"];
              
              allowedKeys.forEach(function(key) {
                if (feature.properties[key] !== undefined && feature.properties[key] !== null && feature.properties[key] !== "") {
                  // Format 'name' cleanly like a bold headline
                  if (key === "name") {
                    description += "<h4 style='margin:0 0 6px 0; font-size:16px; color:#111; border-bottom:1px solid #eee; padding-bottom:4px;'>" + feature.properties[key] + "</h4>";
                  } else {
                    // Capitalise the labels inside the popup box output layout automatically
                    var label = key.charAt(0).toUpperCase() + key.slice(1);
                    description += "<p style='margin:4px 0;'><strong>" + label + ":</strong> " + feature.properties[key] + "</p>";
                  }
                }
              });
              
              layer.bindPopup(description || "No descriptions available.");
            }
          }
        });

        var allBounds = L.featureGroup(Object.values(groups)).getBounds();
        if (allBounds.isValid()) { map.fitBounds(allBounds, { padding: [40, 40] }); }
      })
      .catch(function(err) { console.error(err); });
  </script>
</body>
</html>
