<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TES10</title>

  <!-- Leaflet Core -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; background: #e5e5e5; }
    .leaflet-popup-content-wrapper { padding: 14px; border-radius: 8px; font-family: sans-serif; }
    .leaflet-popup-content h4 { margin: 0 0 6px 0; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 4px; color: #111; }
    .leaflet-popup-content p { margin: 4px 0; font-size: 14px; color: #444; }
  </style>
</head>

<body oncontextmenu="return false;">
  <div id="map"></div>

  <script>
    var map = L.map("map", { contextmenu: false }).setView([0, 0], 2);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    var filterControl = L.control.layers(null, null, { collapsed: true }).addTo(map);
    var groups = {};
// 1. Broad category → colour map
var broadCategoryColors = {
  "007": "#FFD700",
  "EST": "#673AB7",
  "Art": "#E91E63",
  "Film": "#FF9800",
  "Historical & Architecture": "#795548",
  "Literature": "#3F51B5",
  "Music": "#009688",
  "Nature": "#4CAF50",
  "Wanderlust": "#FF5722"
};

// 2. Create a cluster group for each broad category
var broadClusters = {};
Object.keys(broadCategoryColors).forEach(function(cat) {
  broadClusters[cat] = L.markerClusterGroup({
    maxClusterRadius: 50,
    showCoverageOnHover: false,
    iconCreateFunction: function(cluster) {
      var count = cluster.getChildCount();
      var color = broadCategoryColors[cat];

      return L.divIcon({
        html: "<div style='background:" + color + "; color:white; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-weight:bold;'>" + count + "</div>",
        className: "broad-category-cluster",
        iconSize: [40, 40]
      });
    }
  });

  map.addLayer(broadClusters[cat]);
});

// 3. Assign markers to the correct broad category cluster
function addMarkerToBroadCluster(feature, marker) {
  var cat = feature.properties.category;

  // Fallback if category is missing or unknown
  if (!broadClusters[cat]) {
    cat = "Wanderlust"; // or choose a default
  }

  broadClusters[cat].addLayer(marker);
}


    var markerColors = {
      "film location": "red",
      "music location": "blue",
      "literature location": "gold",
      "Default": "green"
    };

    function getCustomIcon(colorName) {
      return L.icon({
        iconUrl: './' + colorName + '.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
      });
    }

    fetch("./atad-pam.geojson")
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: function(feature, latlng) {
            var catValue = feature.properties.category || "Default";
            var clr = markerColors[catValue] || markerColors["Default"];
            var marker = L.marker(latlng, { icon: getCustomIcon(clr) });

  if (!groups[catValue]) {
    groups[catValue] = L.layerGroup();
    var displayTitle = catValue.split(' ')
      .map(w => w.charAt(0).toUpperCase() + w.slice(1))
      .join(' ');
    filterControl.addOverlay(groups[catValue], displayTitle);
  }

            groups[catValue].addLayer(marker);
addMarkerToBroadCluster(feature, marker);
            return marker;
          },
          onEachFeature: function(feature, layer) {
            var description = "";
            ["name", "description", "category", "genre", "misc"].forEach(function(key) {
              if (feature.properties[key]) {
                if (key === "name") {
                  description += "<h4>" + feature.properties[key] + "</h4>";
                } else {
                  description += "<p><strong>" + key + ":</strong> " + feature.properties[key] + "</p>";
                }
              }
            });
            layer.bindPopup(description || "Location details");
          }
        });

        var allBounds = markersClusterGroup.getBounds();
        if (allBounds.isValid()) {
          map.fitBounds(allBounds, { padding: [40, 40] });
        }
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
