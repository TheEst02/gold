<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blogger Embed Map</title>
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; background: #fafafa; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map("map").setView([0, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    // Dynamic self-referencing file location
    fetch("./atad-pam.geojson")
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var layer = L.geoJSON(data, {
          onEachFeature: function(feature, layer) {
            if (feature.properties) {
              var content = Object.entries(feature.properties)
                .map(function(p) { return "<strong>" + p[0] + ":</strong> " + p[1]; })
                .join("<br>");
              layer.bindPopup(content);
            }
          }
        }).addTo(map);
        map.fitBounds(layer.getBounds());
      }).catch(function(err) { console.error(err); });
  </script>
</body>
</html>
