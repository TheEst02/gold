<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blogger Embed Map 2</title>
  <!-- Load Leaflet Stylesheets and JS Engine -->
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  <style>
    /* Force full-bleed viewport so the container doesn't collapse to 0 pixels */
    html, body, #map { height: 100%; margin: 0; padding: 0; background: #e5e5e5; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // Initialize map safely with a global fallback coordinate structure
    var map = L.map("map").setView([20, 0], 2);

    // Load OpenStreetMap map tiles
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, 
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    // Relative link safely pulls from the same repository folder path
    var geojsonUrl = "./atad-pam.geojson";

    fetch(geojsonUrl)
      .then(function(res) {
        if (!res.ok) throw new Error("HTTP error! Status: " + res.status);
        return res.json();
      })
      .then(function(data) {
        var layer = L.geoJSON(data, {
          onEachFeature: function(feature, layer) {
            // Check if properties exist to prevent undefined popup crashes
            if (feature.properties) {
              var description = "";
              for (var key in feature.properties) {
                if (feature.properties.hasOwnProperty(key)) {
                  description += "<strong>" + key + ":</strong> " + feature.properties[key] + "<br>";
                }
              }
              layer.bindPopup(description || "No data attributes.");
            }
          }
        }).addTo(map);

        // Safely adjust view boundaries only if coordinates parsed correctly
        if (layer.getBounds().isValid()) {
          map.fitBounds(layer.getBounds(), { padding: [30, 30] });
        }
      })
      .catch(function(err) {
        console.error("Map parsing failed:", err);
        // Show the precise error directly on screen for easy debugging
        document.body.innerHTML = "<div style='padding:25px; font-family:sans-serif; color:#721c24; background:#f8d7da;'><h3>Map Render Failure</h3><p>" + err.message + "</p></div>";
      });
  </script>
</body>
</html>
